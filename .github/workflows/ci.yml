name: CI - Continuous Integration Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. KIỂM TRA TYPE-SAFETY & CÚ PHÁP (STATIC ANALYSIS)
  # ============================================================================
  typecheck:
    name: Type-Check & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Kiểm tra Backend (--ignore-scripts: không tải binary Electron trên CI)
      - name: Install Backend Dependencies
        run: npm ci --ignore-scripts

      - name: Type-Check Backend (TypeScript)
        run: npx tsc --noEmit

      - name: Run Backend Tests
        run: npm test

      # Kiểm tra Frontend (Client)
      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Type-Check Client (TypeScript)
        working-directory: ./client
        run: npx tsc --noEmit

      # Chạy thật server đã biên dịch: bắt được lỗi chỉ xuất hiện lúc khởi động
      # (thiếu file schema, env từ chối cấu hình) mà tsc và unit test không thấy.
      - name: Smoke Test - Server khởi động và xác thực hoạt động
        shell: bash
        env:
          APP_AUTH_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-0123456789abcdef0123456789abcdef
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: '3123'
          DB_MODE: embedded
          DB_DATA_DIR: memory://
        run: |
          npm run build
          node dist/server.js &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3123/health > /dev/null; then break; fi
            sleep 1
          done
          echo "--- /health ---"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3123/health | grep -qx 200
          echo "--- /api/* không token phải là 401 ---"
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3123/api/v1/attempts/history | grep -qx 401
          echo "--- /api/* có token phải khác 401 ---"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "x-app-token: $APP_AUTH_TOKEN" http://127.0.0.1:3123/api/v1/attempts/history)
          test "$CODE" != "401"
          echo "--- /app-config.json phải trả token ---"
          curl -s http://127.0.0.1:3123/app-config.json | grep -q "$APP_AUTH_TOKEN"
          kill $SERVER_PID
          echo "Smoke test OK"

  # ============================================================================
  # 2. KIỂM TRA ĐÓNG GÓI BUILD SẢN PHẨM
  # ============================================================================
  build-test:
    name: Build Verification
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          cd client && npm ci

      - name: Build Backend Bundle
        run: npm run build

      - name: Build Frontend SPA
        working-directory: ./client
        run: npm run build

  # ============================================================================
  # 3. KIỂM TRA DOCKER MULTI-STAGE BUILD
  # ============================================================================
  docker-build:
    name: Docker Image Build Test
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-run Check)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: medquiz-ai:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
